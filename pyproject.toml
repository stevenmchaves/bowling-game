[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bowling_game"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Steven Chaves", email = "steven.chaves@gmail.com" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "openai>=1.99.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0"
]

[tool.setup.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-s --cov=bowling --cov=main --cov=fastapi_app --cov=coach --cov-report=term-missing --cov-report=html"

[tool.vercel]
entrypoint = "fastapi_app:app"
