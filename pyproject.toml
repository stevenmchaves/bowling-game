[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bowling_game"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Steven Chaves", email = "stevenmchaves@gmail.com" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[tool.setup.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-s --cov=bowling --cov=main --cov-report=term-missing --cov-report=html"

